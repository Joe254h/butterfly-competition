name: Evaluate Butterfly Submission

on:
  pull_request:
    paths:
      - 'submissions/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Detect submission file
        id: submission
        run: |
          FILE=$(git diff --name-only --diff-filter=A origin/${{ github.base_ref }}...HEAD | grep '^submissions/' | head -n1)
          echo "file=$FILE" >> $GITHUB_OUTPUT
          echo "Detected submission: $FILE"

      - name: Run evaluation
        if: steps.submission.outputs.file != ''
        run: python evaluation/score.py "${{ steps.submission.outputs.file }}"

      - name: Update leaderboard
        if: steps.submission.outputs.file != ''
        env:
          GITHUB_ACTOR: ${{ github.actor }}
        run: python leaderboard/update.py score.json

      - name: Commit leaderboard
        if: steps.submission.outputs.file != ''
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add leaderboard/README.md scores.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Leaderboard update"
          git push

      - name: Comment score on PR
        if: steps.submission.outputs.file != ''
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');

            const score = JSON.parse(fs.readFileSync('score.json','utf8'));

            const accuracy = (score.accuracy * 100).toFixed(2);
            const f1 = (score.f1_macro * 100).toFixed(2);

            const message = `
## 🦋 Submission Evaluated

Accuracy: ${accuracy}%
F1 Score: ${f1}%

Participant: @${context.actor}
`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });
